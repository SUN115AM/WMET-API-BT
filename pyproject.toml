[project]
name = "wemt-bt-api"
version = "0.1.0"
description = "Simple Python API for WEMT electromagnetic tracking pose streams over Bluetooth."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
